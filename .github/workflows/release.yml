name: Publish addon release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    permissions:
      contents: write # Create the GitHub release and upload its assets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release configuration
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          project_id=$(sed -n 's/^## X-Curse-Project-ID: //p' FlareUI_RP.toc)
          [[ "$project_id" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Set X-Curse-Project-ID in FlareUI_RP.toc to the numeric CurseForge project ID"; exit 1; }
          [[ -n "$CF_API_KEY" ]] || { echo "::error::Set the CF_API_KEY repository secret"; exit 1; }
          version=$(sed -n 's/^## Version: //p' FlareUI_RP.toc)
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "::error::Release tag must match the TOC version (v$version)"; exit 1; }
      - name: Package and upload
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2
        with:
          pandoc: 'false'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
